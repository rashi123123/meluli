name: Release Meluli
# Signs in one job, verifies from outside it in a second with no secrets, and publishes in a third.
# docs/RELEASE.md lists the secrets, variables and environments this expects.
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    if: github.repository == 'rashi123123/meluli'
    uses: ./.github/workflows/validate.yml

  build:
    needs: validate
    runs-on: macos-15
    # Apple's first notarizations for a team can take well over an hour; each of the two
    # submissions may wait up to 2 h (package-native-release.sh).
    timeout-minutes: 300
    environment: release-signing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: The tag must be on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: Every signing input must be present
        env:
          CSC_LINK: ${{ secrets.MAC_CERTIFICATE_P12_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          APPLE_SIGNING_IDENTITY: ${{ vars.APPLE_SIGNING_IDENTITY }}
        run: |
          for name in CSC_LINK CSC_KEY_PASSWORD APPLE_API_KEY_P8_BASE64 APPLE_API_KEY_ID APPLE_API_ISSUER APPLE_TEAM_ID APPLE_SIGNING_IDENTITY; do
            [ -n "${!name}" ] || { echo "::error::$name is missing. No unsigned release is built."; exit 1; }
          done
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run prepare:runtime
      - name: Sign and notarize
        env:
          CSC_LINK: ${{ secrets.MAC_CERTIFICATE_P12_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          APPLE_SIGNING_IDENTITY: ${{ vars.APPLE_SIGNING_IDENTITY }}
        run: |
          APPLE_API_KEY="$RUNNER_TEMP/AuthKey.p8"
          export APPLE_API_KEY
          trap 'rm -f "$APPLE_API_KEY"' EXIT
          (umask 077 && printf '%s' "$APPLE_API_KEY_P8_BASE64" | base64 --decode > "$APPLE_API_KEY")
          unset APPLE_API_KEY_P8_BASE64
          bash scripts/meluli2/package-native-release.sh "$GITHUB_REF_NAME"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: meluli-release
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
          path: |
            release/Meluli-*-arm64.dmg
            release/Meluli-*-arm64.zip
            release/releases.json
            release/SHA256SUMS.txt

  verify:
    needs: build
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: meluli-release
          path: release
      - name: Verify the archives as a user would receive them
        env:
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
        run: bash scripts/verify-release-artifacts.sh release "${GITHUB_REF_NAME#v}" "$APPLE_TEAM_ID"

  publish:
    needs: verify
    runs-on: macos-15
    timeout-minutes: 20
    environment: release-publish
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: meluli-release
          path: release
      - name: Publish only what was verified
        run: |
          (cd release && shasum -a 256 -c SHA256SUMS.txt)
          gh release create "$GITHUB_REF_NAME" release/* --verify-tag --draft --title "Meluli ${GITHUB_REF_NAME#v}" --generate-notes
          # The draft's assets must match, byte for byte, before anyone can reach them.
          mkdir uploaded
          gh release download "$GITHUB_REF_NAME" --dir uploaded
          (cd uploaded && shasum -a 256 -c ../release/SHA256SUMS.txt)
          # A prerelease never becomes "latest", so the update feed cannot offer it.
          case "$GITHUB_REF_NAME" in
            *-*) gh release edit "$GITHUB_REF_NAME" --draft=false --prerelease ;;
            *) gh release edit "$GITHUB_REF_NAME" --draft=false --latest ;;
          esac
