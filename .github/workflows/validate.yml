name: Validate Meluli
on:
  push:
    # A tag goes through release.yml, which calls this workflow itself.
    branches: ['**']
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  app:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm run lint
      - name: Generated npm notices match the lockfile
        run: pnpm run licenses && git diff --exit-code -- resources/licenses/npm
      - name: Unit, renderer and prerequisite-gated integration tests
        run: pnpm test
      - name: Build the pinned native ASR runtime
        run: pnpm run build:asr-worker
      - name: Native protocol smoke test without model weights
        run: node scripts/check-asr-protocol.mjs
      - run: bash scripts/build-native-helpers.sh
      - name: Clipboard private-pasteboard self-test
        run: resources/bin/meluli-clipboard --self-test
      - run: pnpm run build:app
      - name: Electron E2E with isolated profiles and simulated ASR
        run: pnpm exec playwright test
      # Meluli 2.0 (D20): the release ships the native host, so its runtime and app build run on every
      # push. Last, because the native build rebuilds out/renderer for Safari after the Electron E2E.
      - name: Native host conformance, Node against JavaScriptCore
        run: node scripts/meluli2/native-host-conformance.mjs
      - name: Native app build, signed ad hoc, never launched
        run: node scripts/meluli2/build-native-app.mjs --out .build/native-app-ci
