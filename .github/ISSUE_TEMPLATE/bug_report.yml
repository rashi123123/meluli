name: Bug report / דיווח תקלה
description: Report a reproducible problem without private recordings or transcripts.
labels: ["bug", "triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What happened? / מה קרה?
      description: Expected and actual behavior; Hebrew or English is welcome.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce / איך משחזרים?
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area / תחום
      options:
        - Dictation and the floating window / הכתבה והחלון הצף
        - Pasting into another app / הדבקה
        - Text, punctuation and numbers / טקסט, פיסוק ומספרים
        - Actions / פעולות
        - History and export / היסטוריה וייצוא
        - Calls / שיחות
        - Setup and permissions / הגדרה והרשאות
        - Install and updates / התקנה ועדכונים
        - Other / אחר
    validations:
      required: true
  - type: dropdown
    id: engine
    attributes:
      label: Engine / מנוע
      options:
        - Whisper (מדויק, the default)
        - Streaming (מהיר וקל, experimental)
        - Not related to transcription
  - type: input
    id: environment
    attributes:
      label: Meluli version, macOS version, chip and RAM
      placeholder: "0.2.0, macOS 15.4, M2, 16 GB"
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Optional evidence
      description: Remove private text, paths and personal information. Do not attach recordings without the speakers' permission.
